buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.shockwave.pdfium'
    compileSdk 35
    ndkVersion "26.1.10909125"

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        ndkBuild {
            // Provides a relative path to your Android.mk build script.
            path "src/main/jni/Android.mk"
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'

        pickFirst 'lib/armeabi-v7a/libjniPdfium.so'
        pickFirst 'lib/arm64-v8a/libjniPdfium.so'
        pickFirst 'lib/x86_64/libjniPdfium.so'
        pickFirst 'lib/x86/libjniPdfium.so'

        pickFirst 'lib/armeabi-v7a/libmodpdfium.so'
        pickFirst 'lib/arm64-v8a/libmodpdfium.so'
        pickFirst 'lib/x86_64/libmodpdfium.so'
        pickFirst 'lib/x86/libmodpdfium.so'
    }

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.9.0"

        buildConfigField("String", "LIBRARY_VERSION_NAME", "\"${defaultConfig.versionName}\"")

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}



dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// Maven publishing configuration
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // Use the Android Archive (AAR) artifact
                artifact bundleReleaseAar

                groupId = 'com.shockwave'
                artifactId = 'pdfium-android'
                version = android.defaultConfig.versionName

                pom {
                    name = 'PdfiumAndroid'
                    description = 'Android PDF rendering library based on PDFium'
                    url = 'https://github.com/barteksc/PdfiumAndroid'
                    packaging = 'aar'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'barteksc'
                            name = 'Bartosz Schiller'
                            email = 'barteksc@gmail.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/barteksc/PdfiumAndroid.git'
                        developerConnection = 'scm:git:ssh://github.com:barteksc/PdfiumAndroid.git'
                        url = 'https://github.com/barteksc/PdfiumAndroid/tree/master'
                    }

                    // Add dependencies to POM
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')

                        // Add runtime dependencies
                        configurations.implementation.allDependencies.each {
                            if (it.group != null && it.name != null) {
                                def dependencyNode = dependenciesNode.appendNode('dependency')
                                dependencyNode.appendNode('groupId', it.group)
                                dependencyNode.appendNode('artifactId', it.name)
                                dependencyNode.appendNode('version', it.version)
                                dependencyNode.appendNode('scope', 'runtime')
                            }
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'local'
                url = uri("${rootProject.buildDir}/repo")
            }
        }
    }
}

